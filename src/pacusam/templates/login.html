{% extends "base.html" %}
{% block title %}Ingresar · PACUSAM{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-surface border border-border rounded-lg p-8 shadow-sm">
    <h1 class="font-display text-2xl text-ink mb-1">PACUSAM</h1>
    <p class="text-sm text-muted mb-6">Ingresa para curar imágenes.</p>

    {% if error %}
    <div class="mb-4 px-3 py-2 rounded border border-rejected/30 bg-rejected-tint text-sm text-rejected" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-muted mb-1" for="email">Email</label>
        <input id="email" type="email" name="email" value="{{ email or '' }}" required autofocus
               class="w-full px-3 py-2 text-sm border border-border rounded bg-app focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-colors duration-150">
      </div>
      <div>
        <label class="block text-xs font-medium text-muted mb-1" for="password">Contraseña</label>
        <input id="password" type="password" name="password" required
               class="w-full px-3 py-2 text-sm border border-border rounded bg-app focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent transition-colors duration-150">
      </div>
      <button type="submit"
              class="w-full px-3 py-2 text-sm font-medium text-white bg-accent hover:bg-accent-hover rounded transition-colors duration-150">
        Ingresar
      </button>
    </form>

    <p class="mt-6 text-sm text-muted text-center">
      No tenes cuenta?
      <a href="/register" class="text-accent hover:text-accent-hover">Crear cuenta</a>
    </p>

    <div class="mt-6 pt-4 border-t border-border text-center">
      <p class="text-xs text-faint">Demo: <span class="font-mono text-muted">demo@pacusam.org</span> / <span class="font-mono text-muted">demo1234</span></p>
    </div>
  </div>
</div>
{% endblock %}
